[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ielec"
version = "0.1.0"
description = "Herramienta de diseño de instalaciones eléctricas residenciales según NTC 2050 y RETIE"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "typer>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]
planos = [
    "ezdxf>=1.1.0",
    "shapely>=2.0.0",
    "matplotlib>=3.7.0",
    "pillow>=9.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
